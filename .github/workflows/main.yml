name: Build LM - H Joel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: H_Joel_Android_GitHub_Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "LM - H Joel.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LM - H Joel APK
          path: H_Joel_Android_GitHub_Actions/LM - H Joel.apk
          retention-days: 30

